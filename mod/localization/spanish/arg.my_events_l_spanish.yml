mazorca.3.t:"La mazorca"
mazorca.3.d:"Un libro extranjero, algunas cartas mal guardadas y una visita nocturna bastan para poner en duda la lealtad de un ciudadano."
mazorca.3.f:"El hombre había intentado explicar que sólo leía por curiosidad. Nadie en la sala pareció considerar aquello una defensa sensata.\n\n—La curiosidad es una virtud peligrosa.\n\n—No sabía que leer estuviera prohibido.\n\nEl mazorquero tomó uno de los papeles y lo acercó a la lámpara. —Leer mal, en cambio, suele traer consecuencias.\n\nBajo la luz temblorosa, el retrato en la pared parecía menos una imagen que una presencia.\n\n—¿Y quién decide si he leído mal?\n\n—Esta noche, nosotros."
mazorca.3.a:"Un pequeño precio a pagar por el orden."

mazorca.2.t:"La mazorca"
mazorca.2.d:"La Mazorca ha intensificado sus patrullajes nocturnos, enfocando su ira en los círculos literarios y académicos."
mazorca.2.f:"—¡Yo amo al Restaurador! ¡Es más, mi perro se llama Juan Manuel! —gritaba el joven poeta, mientras dos hombres armados con garrotes lo arrastraban por las solapas hacia el callejón.\n\n—Callate, salvaje unitario. Te escuchamos recitando esos versitos sobre la "libertad" y las "luces de Europa" en la taberna —gruñó uno de los matones, sacando un cuchillo tan largo como su brazo.\n\n—¡Era sarcasmo! ¡Una ironía estilística! ¡Ustedes no entienden las vanguardias literarias modernas! —lloriqueó el muchacho, aferrándose a un farol—. ¡Por favor, suéltenme, tengo alergia a la sangre... especialmente a la mía!"
mazorca.2.a:"Un pequeño precio a pagar por el orden."

mazorca.1.t:"La divisa punzó"
mazorca.1.d:"La lealtad federal ya no vive solo en discursos y proclamas. Ahora debe llevarse sobre el pecho."
mazorca.1.f:"No hubo gritos en la sala, ni soldados golpeando la puerta, ni decreto leído en voz alta.\n\nSolo una bandeja con cintas rojas y varios hombres demasiado prudentes para preguntar si podían negarse.\n\nEl funcionario prendió la divisa con cuidado, como quien ajusta una prenda de gala.\n\nPero todos sabían que aquella tela no adornaba al hombre: lo señalaba.\n\nQuien la llevaba quedaba a salvo por ahora. Quien no, empezaba a ser recordado."
mazorca.1.a:"The age of disorder must give way to the Nation."
divisa_punzo_modifier: "Divisa punzó"
mazorca_modifier: "Terror de la mazorca"

supreme_power.1.t: "La Suma del Poder Público"
supreme_power.1.d: "La Confederación, desgastada por guerras civiles y divisiones internas, ha entregado al Gobernador la suma del poder público, en nombre del orden."
supreme_power.1.f: "Los representantes discutieron durante horas la forma exacta de la concesión. Algunos querían que sonara temporal. Otros, inevitable. Nadie quería que sonara como rendición.\n\n—No entregamos la Confederación.\n\n—No. Sólo entregamos los medios para salvarla.\n\n—¿Y quién distinguirá una cosa de la otra?\n\nLa pregunta quedó suspendida sobre la mesa, incómoda e inútil. El acta ya estaba preparada, y la pluma esperaba."
supreme_power.1.a: "La anarquía será contenida."
supreme_power_modifier: "La suma del poder público"
supreme_power.2.t: "La caída del Restaurador"
supreme_power.2.d: "Mientras [SCOPE.sCharacter('our_leader').GetFullName] abandona el país hacia el exilio, la sociedad experimenta de golpe el choque entre el desmantelamiento de los símbolos dictatoriales y la cruda realidad económica de la reorganización nacional."
supreme_power.2.f: "—¡Alégrese! ¡hoy hemos restaurado la verdadera libertad!\n\n—Se lo agradezco infinitamente, señor. Supongo que con tanta libertad y legalidad, el nuevo gobierno ya no me cobrará las contribuciones forzosas que nos exigía la Mazorca\n\n—Bueno, tampoco nos precipitemos, el tirano huyó, pero dejó las arcas del Estado completamente vacías. Técnicamente le cobraremos los mismos impuestos, solo que ahora perderemos tres horas debatiéndolos en el Congreso para que sean constitucionales.\n\n—Ya comprendo. La libertad republicana cuesta  lo mismo, pero viene con muchísimos más discursos. Fascinante."
supreme_power.2.a: "Viva la Patria!"
supreme_power.2.b: "Ahora podemos promulgar una nueva constitución."
supreme_power.3.t: "La nueva constitución"
supreme_power.3.d: "Entre discursos solemnes, firmas temblorosas y sonrisas calculadas, nace un nuevo orden nacional."
supreme_power.3.f: "—Hemos redactado un documento brillante. La república civilizada, con sus derechos y su orden, por fin existe de forma perfecta en este papel.\n\n—En el papel funciona de maravilla, doctor. Pero allá afuera siguen gobernando los caudillos, las deudas y los caminos de barro. ¿Cómo le imponemos este hermoso libro de reglas a una tierra que solo respeta el filo de un sable?\n\n—Paso a paso, mi querido amigo. Primero escribimos la ley, y luego obligamos a la realidad a obedecerla con el tiempo. Puede que el país siga siendo un caos por ahora... pero al menos hoy, oficialmente, es un caos inconstitucional."
supreme_power.3.a: "Promulgar nueva constitución."
new_laws_modifier: "Una nueva era"

salons.1.t: "Salones literarios"
salons.1.d: "En Argentina, un grupo de jóvenes letrados se reúne para discutir literatura, filosofía y el futuro de la patria."
salons.1.f: "Sobre la mesa descansaban libros franceses, manuscritos incompletos y algunas ideas que todavía no habían decidido si eran literatura o delito.\n\n—No estamos conspirando.\n\n—Por supuesto que no. Sólo estamos pensando en voz alta.\n\n—En estos tiempos, pensar en voz alta es casi una forma de conspiración.\n\n—Entonces tendremos que escribir en voz baja.\n\nNadie rió demasiado. En Argentina, hasta los chistes necesitaban discreción."
salons.1.a: "Observémoslos de cerca."
salons.1.b: "Basta de reuniones privadas."

salons.2.t: "Civilización y barbarie"
salons.2.d: "El gobierno de Argentina descubre que no todas las amenazas llegan a caballo."
salons.2.f: "Allí estaban la campaña, los caudillos, la barbarie, la civilización y otras palabras extranjeras.\n\nEl libro quedó sobre la mesa como una prueba sin delito claro. Bastaba con leerlo para entender la intención; bastaba con prohibirlo para confirmar la acusación.\n\n—¿Qué haremos con él?\n\n—Lo mismo que con todos los libros peligrosos: fingir que no nos inquieta, mientras rastreamos cada ejemplar y a cada hombre que se haya atrevido a leerlo."
salons.2.a: "Un libro no gobierna."
salons.2.b: "Censura el libro."

