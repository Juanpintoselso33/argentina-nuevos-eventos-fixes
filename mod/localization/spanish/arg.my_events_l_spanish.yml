 je_rosas: "La Era de Rosas"
 je_rosas_reason: "El poder público ha sido reunido en una sola mano, y esa mano no tiembla.\n\nBajo Rosas, la Confederación conserva la paz de los cementerios prudentes y de los salones donde nadie levanta la voz. La divisa punzó adorna pechos, puertas y conciencias; los periódicos aprenden disciplina; los opositores descubren las virtudes climáticas de Montevideo y Santiago.\n\nPero ningún régimen personal puede gobernar eternamente sobre una Nación que todavía no se atreve a nacer. Tarde o temprano, la espada del Restaurador deberá enfrentarse a la pluma de los constituyentes."

