blockade.1.t: "El bloqueo civilizador"
blockade.1.d: "Pretextando la supuesta barbarie de nuestro gobierno y agravios al comercio extranjero, una gran potencia ha enviado sus escuadras para cerrar nuestros puertos."
blockade.1.f: "—Nuestras exportaciones dominaban sus mercados, y como no pueden competir, nos bloquean. ¡No entregaremos nuestra soberanía!\n\n—Señor, nuestra riqueza provenía de venderles a ellos. Ahora los almacenes están llenos de cueros pudriéndose y el Estado no recauda, debemos ser pragmáticos."
blockade.1.a: "El bloqueo será el motor de la industria nacional."
blockade.1.b: "Firmad la apertura del mercado."
blockade_modifier: "Bloqueo naval"
protectionist_modifier: "Patriotismo proteccionista"
forced_free_trade_modifier: "Libre comercio forzado"
sovereignty_defended: "Soberanía defendida"
blockade.2.t: "La soberanía defendida"
blockade.2.d: "Las escuadras extranjeras han levantado el bloqueo y se retiran de nuestras aguas. Su intento de forzar la libre navegación comercial mediante los cañones resultó en un fracaso económico frente a nuestra tenaz resistencia. Al negarnos a ceder, hemos obligado al enemigo a claudicar y reconocer nuestra soberanía absoluta."
blockade.2.f: "—Pusimos gruesas cadenas de costa a costa y las defendimos con sangre \n\n—Rompieron los eslabones, sí, ¡pero no pudieron quebrar el espíritu de la Confederación!\n\n—Es un triunfo diplomático sin precedentes, señor Ministro.\n\nEuropa ha reconocido nuestra soberanía fluvial, y el mundo entero sabe ahora que esta nación no se somete a los caprichos imperiales."
blockade.2.a: "¡Honor a los valientes que defendieron nuestras aguas y soberanía!"

customs_laws.1.t: "La Ley de Aduanas"
customs_laws.1.d: "Hartos del contrabando y la dependencia de los productos europeos, hemos cerrado la puerta al saqueo extranjero."
customs_laws.1.f: "—Los caudillos del interior han recibido la noticia de la nueva ley, señor. Por primera vez en años, los telares de Córdoba y los viñedos de San Juan podrán competir sin ser aplastados por las baratijas extranjeras.\n\n—Exacto. La lealtad no se compra únicamente con plomo y sables; a veces requiere firmar un trozo de papel que encarezca el vino francés. Hemos atado el destino de las provincias a nuestra Aduana.\n\n—¿Y los comerciantes porteños que vivían de revender contrabando europeo? Se quejan de la tiranía de los aranceles.\n\n—A los que se quejen en voz muy alta, recuérdales que la Mazorca también sabe hacer cumplir las leyes económicas."
customs_laws.1.a: "La Aduana es el corazón de la Nación"
customs_laws_tip: "Esto generará descontento y reducirá el poder y los ingresos de las provincias del interior."

piratini.1.t: "El vecino benevolente"
piratini.1.d: "Al canalizar fondos hacia los líderes rebeldes, estamos obligando a nuestros vecinos imperiales a gastar una cantidad exorbitante de recursos, alterando el equilibrio de poder regional a nuestro favor."
piratini.1.f: "—Excelencia, el Ministro de Hacienda dice que enviar todo nuestro oro a esos estancieros en rebeldía arruinará la....\n\n—Nosotros enviamos cien fusiles oxidados y un cofre de plata. A cambio, el Emperador moviliza tres batallones, paga raciones infladas, pierde prestigio internacional y entierra a la mitad de sus hombres en el lodo.\n\n—¿Pero y si los secesionistas terminan perdiendo la guerra de todos modos?\n\n—Además, la mitad de los fusiles que enviamos estaban defectuosos desde la independencia. Sírveme otro mate."
piratini.1.a: "Ayúdalos clandestinamente."
piratini.1.b: "Eso no nos interesa."

piratini.2.t: "El sur se abre"
piratini.2.d: "Con la independencia de la República Piratini, el Imperio pierde su acceso terrestre al Plata y sufre una crisis de prestigio que amenaza con fracturarlo."
piratini.2.f: "—Que celebren su independencia. Toda república joven necesita vender, comprar mucho y encontrar quién la reconozca.\n\nNadie quería parecer demasiado satisfecho, pero todos entendían lo ocurrido: el Brasil había perdido su camino terrestre hacia el Plata. Sin Rio Grande, el Imperio debería hablar más y marchar menos.\n\nUruguay parecía menos protegido, Montevideo menos distante, y la frontera sur del Brasil, antes firme, comenzaba a parecer una línea escrita sobre agua."
piratini.2.a: "El tablero diplomático y económico sudamericano nos pertenece."
clandestine_support_tip: "Aumentaremos razonablemente las posibilidades de supervivencia de la república separatista."

