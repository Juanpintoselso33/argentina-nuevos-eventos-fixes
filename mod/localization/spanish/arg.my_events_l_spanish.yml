saladeros.1.t: "Carne, cuero y poder"
saladeros.1.d: "La carne salada argentina encuentra compradores en los mercados extranjeros, fortaleciendo a los estancieros y vinculando la economía nacional al comercio atlántico."
saladeros.1.f: "No había máquinas elegantes ni chimeneas ordenadas.\n\nSólo corrales, cuchillos, sal, humo y hombres acostumbrados a no apartar la vista. Allí, donde la estancia terminaba y comenzaba el puerto, la Confederación encontraba una industria a su medida.\n\n—Dicen que esto no es progreso.\n\n—Entonces no han visto cuánto pagan por nuestros cueros.\n\nLa sangre corría por los canales hasta perderse en el barro. Sobre ella se levantaba, lenta y olorosa, una nueva riqueza."
saladeros.1.a: "El tasajo alimentará nuestra prosperidad."

saladeros.2.t: "El aroma del progreso"
saladeros.2.d: "Los saladeros de la ribera han traído empleo, exportaciones y un olor capaz de derrotar al más firme defensor del libre comercio."
saladeros.2.f: "Primero llegaron las quejas de los vecinos. Luego las de los médicos. Finalmente, incluso algunos funcionarios comenzaron a cerrar las ventanas antes de defender la prosperidad nacional.\n\nLa ribera, generosa como siempre, recibía sangre, grasa, vísceras y todo aquello que la economía no encontraba forma elegante de exportar.\n\n—Dicen que el aire se ha vuelto irrespirable.\n\n—Entonces respiran demasiado cerca de la riqueza.\n\nLa sala quedó en silencio. Desde la orilla llegó una ráfaga espesa y tibia.\n\n—Quizá podríamos producir un poco menos.\n\n—O enseñar a la ciudad a oler el progreso con gratitud."
saladeros.2.a: "La salud pública exige ciertos sacrificios."
saladeros.2.b: "Que la ciudad aprenda a respirar la prosperidad."



