 je_rosas: "The Rosas Era"
 je_rosas_reason: "Public power has been gathered into a single hand, and that hand does not tremble.\n\nUnder Rosas, the Confederation preserves the peace of prudent cemeteries and of salons where no one raises their voice. The punzó badge adorns chests, doors, and consciences; newspapers learn discipline; opponents discover the climatic virtues of Montevideo and Santiago.\n\nBut no personal regime can govern forever over a Nation that still does not dare to be born. Sooner or later, the sword of the Restorer will have to face the pen of the constitution-makers."