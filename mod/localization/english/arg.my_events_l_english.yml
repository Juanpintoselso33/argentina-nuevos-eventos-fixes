 mazorca.3.t:"The Mazorca"
 mazorca.3.d:"A foreign book, a few poorly guarded letters, and a nighttime visit are enough to cast doubt on a citizen's loyalty."
 mazorca.3.f:"The man had tried to explain that he only read out of curiosity. No one in the room seemed to consider that a sensible defense.\n\n—Curiosity is a dangerous virtue.\n\n—I did not know that reading was forbidden.\n\nThe mazorquero took one of the papers and held it close to the lamp. —Reading badly, on the other hand, usually has consequences.\n\nUnder the trembling light, the portrait on the wall seemed less like an image than a presence.\n\n—And who decides whether I have read badly?\n\n—Tonight, we do."
 mazorca.3.a:"A small price to pay for order."

 mazorca.2.t:"The Mazorca"
 mazorca.2.d:"The Mazorca has intensified its nighttime patrols, focusing its wrath on literary and academic circles."
 mazorca.2.f:"—I love the Restorer! In fact, my dog is named Juan Manuel! —shouted the young poet, while two men armed with clubs dragged him by the lapels toward the alley.\n\n—Shut up, savage Unitarian. We heard you reciting those little verses about "freedom" and the "lights of Europe" in the tavern —growled one of the thugs, drawing a knife as long as his arm.\n\n—It was sarcasm! A stylistic irony! You do not understand the modern literary avant-garde! —the young man whimpered, clinging to a streetlamp—. Please, let me go, I am allergic to blood... especially my own!"
 mazorca.2.a:"A small price to pay for order."

 mazorca.1.t:"The scarlet badge"
 mazorca.1.d:"Federal loyalty no longer lives only in speeches and proclamations. Now it must be worn upon the chest."
 mazorca.1.f:"There were no shouts in the room, no soldiers pounding on the door, no decree read aloud.\n\nOnly a tray with red ribbons and several men too prudent to ask whether they could refuse.\n\nThe official fastened the badge carefully, like someone adjusting a formal garment.\n\nBut everyone knew that this cloth did not adorn the man: it marked him.\n\nWhoever wore it was safe for now. Whoever did not began to be remembered."
 mazorca.1.a:"The age of disorder must give way to the Nation."
 divisa_punzo_modifier: "Divisa punzó"
 mazorca_modifier: "Terror of the Mazorca"

 supreme_power.1.t: "The Sum of Public Power"
 supreme_power.1.d: "The Confederation, worn down by civil wars and internal divisions, has granted the Governor the sum of public power, in the name of order."
 supreme_power.1.f: "The representatives debated for hours the exact form of the concession. Some wanted it to sound temporary. Others, inevitable. No one wanted it to sound like surrender.\n\n—We are not handing over the Confederation.\n\n—No. We are only handing over the means to save it.\n\n—And who will distinguish one thing from the other?\n\nThe question hung over the table, uncomfortable and useless. The act was already prepared, and the pen was waiting."
 supreme_power.1.a: "Anarchy will be contained."
 supreme_power_modifier: "The sum of public power"
 supreme_power.2.t: "La caída del Restaurador"
 supreme_power.2.d: "Mientras [SCOPE.sCharacter('our_leader').GetFullName] abandona el país hacia el exilio, la sociedad experimenta de golpe el choque entre el desmantelamiento de los símbolos dictatoriales y la cruda realidad económica de la reorganización nacional."
 supreme_power.2.f: "—¡Alégrese! ¡hoy hemos restaurado la verdadera libertad!\n\n—Se lo agradezco infinitamente, señor. Supongo que con tanta libertad y legalidad, el nuevo gobierno ya no me cobrará las contribuciones forzosas que nos exigía la Mazorca\n\n—Bueno, tampoco nos precipitemos, el tirano huyó, pero dejó las arcas del Estado completamente vacías. Técnicamente le cobraremos los mismos impuestos, solo que ahora perderemos tres horas debatiéndolos en el Congreso para que sean constitucionales.\n\n—Ya comprendo. La libertad republicana cuesta  lo mismo, pero viene con muchísimos más discursos. Fascinante."
 supreme_power.2.a: "Viva la Patria!"
 supreme_power.2.b: "Ahora podemos promulgar una nueva constitución."
 supreme_power.3.t: "La nueva constitución"
 supreme_power.3.d: "Entre discursos solemnes, firmas temblorosas y sonrisas calculadas, nace un nuevo orden nacional."
 supreme_power.3.f: "—Hemos redactado un documento brillante. La república civilizada, con sus derechos y su orden, por fin existe de forma perfecta en este papel.\n\n—En el papel funciona de maravilla, doctor. Pero allá afuera siguen gobernando los caudillos, las deudas y los caminos de barro. ¿Cómo le imponemos este hermoso libro de reglas a una tierra que solo respeta el filo de un sable?\n\n—Paso a paso, mi querido amigo. Primero escribimos la ley, y luego obligamos a la realidad a obedecerla con el tiempo. Puede que el país siga siendo un caos por ahora... pero al menos hoy, oficialmente, es un caos inconstitucional."
 supreme_power.3.a: "Promulgar nueva constitución."
 new_laws_modifier: "Una nueva era"

 salons.1.t: "Literary salons"
 salons.1.d: "In Argentina, a group of young men of letters gathers to discuss literature, philosophy, and the future of the fatherland."
 salons.1.f: "On the table rested French books, unfinished manuscripts, and a few ideas that had not yet decided whether they were literature or crime.\n\n—We are not conspiring.\n\n—Of course not. We are only thinking out loud.\n\n—In these times, thinking out loud is almost a form of conspiracy.\n\n—Then we will have to write in a low voice.\n\nNo one laughed too much. In Argentina, even jokes required discretion."
 salons.1.a: "Let us observe them closely."
 salons.1.b: "Enough private meetings."

 salons.2.t: "Civilization and barbarism"
 salons.2.d: "The government of Argentina discovers that not all threats arrive on horseback."
 salons.2.f: "There they were: the countryside, the caudillos, barbarism, civilization, and other foreign words.\n\nThe book remained on the table like evidence without a clear crime. It was enough to read it to understand the intention; it was enough to ban it to confirm the accusation.\n\n—What shall we do with it?\n\n—The same as with all dangerous books: pretend it does not trouble us, while we track down every copy and every man who has dared to read it."
 salons.2.a: "A book does not govern."
 salons.2.b: "Censor the book."

