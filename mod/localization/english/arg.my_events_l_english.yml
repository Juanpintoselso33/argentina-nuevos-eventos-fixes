l_english:

 blockade.1.t: "The civilizing blockade"
 blockade.1.d: "Under the pretext of the supposed barbarism of our government and grievances against foreign trade, a great power has sent its squadrons to close our ports."
 blockade.1.f: "—Our exports dominated their markets, and since they cannot compete, they blockade us. We shall not surrender our sovereignty!\n\n—Sir, our wealth came from selling to them. Now the warehouses are full of rotting hides and the State collects no revenue; we must be pragmatic."
 blockade.1.a: "The blockade will be the engine of national industry."
 blockade.1.b: "Sign the opening of the market."
 blockade_modifier: "Naval blockade"
 protectionist_modifier: "Protectionist patriotism"
 forced_free_trade_modifier: "Forced free trade"
 sovereignty_defended: "Sovereignty defended"
 blockade.2.t: "Sovereignty defended"
 blockade.2.d: "The foreign squadrons have lifted the blockade and are withdrawing from our waters. Their attempt to force free commercial navigation through cannon fire has resulted in an economic failure in the face of our tenacious resistance. By refusing to yield, we have forced the enemy to capitulate and recognize our absolute sovereignty."
 blockade.2.f: "—We laid heavy chains from coast to coast and defended them with blood \n\n—They broke the links, yes, but they could not break the spirit of the Confederation!\n\n—It is an unprecedented diplomatic triumph, Minister.\n\nEurope has recognized our river sovereignty, and the whole world now knows that this nation does not submit to imperial whims."
 blockade.2.a: "Honor to the brave men who defended our waters and sovereignty!"

 customs_laws.1.t: "The Customs Law"
 customs_laws.1.d: "Tired of smuggling and dependence on European products, we have closed the door to foreign plunder."
 customs_laws.1.f: "—The caudillos of the interior have received news of the new law, sir. For the first time in years, the looms of Córdoba and the vineyards of San Juan will be able to compete without being crushed by foreign trinkets.\n\n—Exactly. Loyalty is not bought only with lead and sabers; sometimes it requires signing a piece of paper that makes French wine more expensive. We have tied the fate of the provinces to our Customs House.\n\n—And the Buenos Aires merchants who lived by reselling European contraband? They complain about the tyranny of tariffs.\n\n—To those who complain too loudly, remind them that the Mazorca also knows how to enforce economic laws."
 customs_laws.1.a: "The Customs House is the heart of the Nation"
 customs_laws_tip: "This will generate unrest and reduce the power and income of the interior provinces."

 piratini.1.t: "The benevolent neighbor"
 piratini.1.d: "By channeling funds to the rebel leaders, we are forcing our imperial neighbors to spend an exorbitant amount of resources, altering the regional balance of power in our favor."
 piratini.1.f: "—Your Excellency, the Minister of Finance says that sending all our gold to those rebellious ranchers will ruin the....\n\n—We send a hundred rusty rifles and a chest of silver. In return, the Emperor mobilizes three battalions, pays inflated rations, loses international prestige, and buries half his men in the mud.\n\n—But what if the secessionists end up losing the war anyway?\n\n—Besides, half the rifles we sent had been defective since independence. Pour me another mate."
 piratini.1.a: "Help them clandestinely."
 piratini.1.b: "That does not interest us."

 piratini.2.t: "The south opens up"
 piratini.2.d: "With the independence of the Piratini Republic, the Empire loses its land access to the Plata and suffers a crisis of prestige that threatens to fracture it."
 piratini.2.f: "—Let them celebrate their independence. Every young republic needs to sell, buy plenty, and find someone to recognize it.\n\nNo one wanted to seem too satisfied, but everyone understood what had happened: Brazil had lost its land route to the Plata. Without Rio Grande, the Empire would have to talk more and march less.\n\nUruguay seemed less protected, Montevideo less distant, and Brazil's southern frontier, once firm, began to look like a line written on water."
 piratini.2.a: "The South American diplomatic and economic board belongs to us."
 clandestine_support_tip: "We will reasonably increase the chances of survival of the separatist republic."

