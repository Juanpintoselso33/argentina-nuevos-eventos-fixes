 saladeros.1.t: "Meat, hides, and power"
 saladeros.1.d: "Argentine salted beef finds buyers in foreign markets, strengthening the ranchers and linking the national economy to Atlantic trade."
 saladeros.1.f: "There were no elegant machines or orderly chimneys.\n\nOnly corrals, knives, salt, smoke, and men accustomed to not looking away. There, where the ranch ended and the port began, the Confederation found an industry suited to its measure.\n\n—They say this is not progress.\n\n—Then they have not seen how much they pay for our hides.\n\nBlood ran through the channels until it disappeared into the mud. Upon it rose, slowly and odorously, a new wealth."
 saladeros.1.a: "Salted beef will nourish our prosperity."

 saladeros.2.t: "The aroma of progress"
 saladeros.2.d: "The salting houses along the riverbank have brought jobs, exports, and an odor capable of defeating the staunchest defender of free trade."
 saladeros.2.f: "First came the complaints from the neighbors. Then those from the doctors. Finally, even some officials began closing the windows before defending national prosperity.\n\nThe riverbank, generous as always, received blood, fat, entrails, and everything that the economy could find no elegant way to export.\n\n—They say the air has become unbreathable.\n\n—Then they breathe too close to wealth.\n\nThe room fell silent. From the shore came a thick, warm gust.\n\n—Perhaps we could produce a little less.\n\n—Or teach the city to smell progress with gratitude."
 saladeros.2.a: "Public health demands certain sacrifices."
 saladeros.2.b: "Let the city learn to breathe prosperity."

